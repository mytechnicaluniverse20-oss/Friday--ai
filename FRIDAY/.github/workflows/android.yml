
name: Build FRIDAY APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FRIDAY/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p FRIDAY assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-APK
          path: FRIDAY/app/build/outputs/apk/debug/app-debug.apk
